<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3E5AB" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Compass / Radar abstract -->
  <circle cx="400" cy="300" r="250" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.05"/>
  <circle cx="400" cy="300" r="150" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
  <circle cx="400" cy="300" r="50" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.15"/>
  <line x1="400" y1="50" x2="400" y2="550" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
  <line x1="150" y1="300" x2="650" y2="300" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>

  <!-- Abstract waves -->
  <path d="M0,450 Q200,400 400,450 T800,450" fill="none" stroke="url(#gold-grad)" stroke-width="3" opacity="0.5"/>
  <path d="M0,500 Q200,450 400,500 T800,500" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.3"/>
  <path d="M0,550 Q200,500 400,550 T800,550" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
  
  <!-- Abstract Cargo Ship -->
  <g transform="translate(0, 30)">
    <polygon points="250,380 400,420 550,380 400,320" fill="#161616" stroke="#D4AF37" stroke-width="2" opacity="0.9"/>
    <line x1="400" y1="320" x2="400" y2="250" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8"/>
    <!-- Sails / Geometric superstructures -->
    <polygon points="400,250 460,280 400,310" fill="url(#gold-grad)" opacity="0.4"/>
    <polygon points="400,270 360,290 400,310" fill="#D4AF37" opacity="0.2"/>
    <!-- Cargo Box accents -->
    <path d="M410,385 L440,375 L440,365 L410,375 Z" fill="#D4AF37" opacity="0.6"/>
    <path d="M370,390 L390,395 L390,385 L370,380 Z" fill="#D4AF37" opacity="0.4"/>
  </g>
  
  <!-- Ocean data points -->
  <circle cx="200" cy="450" r="3" fill="#D4AF37" opacity="0.7"/>
  <circle cx="600" cy="450" r="3" fill="#D4AF37" opacity="0.5"/>
  <circle cx="450" cy="400" r="2" fill="#D4AF37" opacity="0.9"/>
</svg>