<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="water-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#9C8127" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="45%" stop-color="#14120D"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#1A1710"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#horizon-grad)"/>

  <!-- Grid in the sky -->
  <g opacity="0.05">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300" stroke="#D4AF37" stroke-width="1"/>
    <path d="M 200 0 L 200 400 M 400 0 L 400 400 M 600 0 L 600 400 M 800 0 L 800 400 M 1000 0 L 1000 400" stroke="#D4AF37" stroke-width="1"/>
  </g>

  <!-- Ocean Waves / Sonar below horizon -->
  <g transform="translate(600, 500)">
    <ellipse cx="0" cy="0" rx="400" ry="80" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2">
      <animate attributeName="rx" values="100;400" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="300" ry="60" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3">
      <animate attributeName="rx" values="100;300" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;60" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Glowing Core -->
  <circle cx="600" cy="400" r="300" fill="url(#water-glow)"/>

  <!-- High-Tech Ship Silhouette -->
  <g transform="translate(600, 380) scale(1.4)" filter="url(#neon-glow)">
    <!-- Ship Hull -->
    <path d="M -200,20 L -160,50 L 160,50 L 220,10 L 220,0 L 200,-10 L -180,-10 Z" fill="#0A0A0A" stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Ship Deck Structure -->
    <path d="M -140,-10 L -140,-40 L -60,-40 L -60,-10 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M 0,-10 L 0,-60 L 80,-60 L 100,-30 L 100,-10 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <rect x="20" y="-50" width="15" height="15" fill="none" stroke="#D4AF37" stroke-width="1"/>
    <rect x="45" y="-50" width="15" height="15" fill="none" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Communication Tower -->
    <line x1="30" y1="-60" x2="30" y2="-100" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="30" cy="-100" r="3" fill="#D4AF37">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Cargo Containers Abstract (Squares) -->
    <g opacity="0.8">
      <rect x="-130" y="-35" width="25" height="20" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <rect x="-100" y="-35" width="25" height="20" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <rect x="-70" y="-35" width="25" height="20" fill="none" stroke="#D4AF37" stroke-width="1"/>
      
      <rect x="-130" y="-15" width="25" height="15" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <rect x="-100" y="-15" width="25" height="15" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <rect x="-70" y="-15" width="25" height="15" fill="none" stroke="#D4AF37" stroke-width="1"/>
    </g>
  </g>

  <!-- Overlay UI elements -->
  <g transform="translate(100, 700)" font-family="monospace" font-size="12" fill="#D4AF37" opacity="0.5">
    <text x="0" y="0">VESSEL.TRACKING.ACTIVE</text>
    <text x="0" y="20">OCEAN_FREIGHT: RORO</text>
    <text x="0" y="40">ETA: SCHEDULED</text>
  </g>

  <!-- Satellite Connection Lines -->
  <g opacity="0.3">
    <line x1="642" y1="240" x2="800" y2="100" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="800" cy="100" r="4" fill="#D4AF37"/>
    <circle cx="800" cy="100" r="10" fill="none" stroke="#D4AF37" stroke-width="1">
       <animate attributeName="r" values="4;20" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
