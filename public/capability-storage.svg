<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="storage-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <pattern id="isometric-grid" width="40" height="23.094" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <!-- Isometric grid approximation -->
      <path d="M 0 11.547 L 20 0 L 40 11.547 M 0 11.547 L 20 23.094 L 40 11.547 M 20 0 L 20 23.094" fill="none" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.2"/>
    </pattern>
    <filter id="box-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0A0A0A"/>
  <rect width="100%" height="100%" fill="url(#isometric-grid)"/>

  <circle cx="600" cy="400" r="400" fill="url(#storage-glow)"/>

  <g transform="translate(600, 400)">
    <!-- Central Main Structure (Warehouse/Vault) -->
    <!-- Top Face -->
    <path d="M 0,-150 L 200,-50 L 0,50 L -200,-50 Z" fill="#141414" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/>
    <!-- Left Face -->
    <path d="M -200,-50 L 0,50 L 0,150 L -200,50 Z" fill="#0D0D0D" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right Face -->
    <path d="M 0,50 L 200,-50 L 200,50 L 0,150 Z" fill="#080808" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Outer Grid Beams / Forcefield walls -->
    <g opacity="0.3">
      <path d="M -250,-20 L -50,80 L -50,200 L -250,100 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
      <path d="M 250,-20 L 50,80 L 50,200 L 250,100 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
      
      <!-- Energy bands inside the left forcefield -->
      <line x1="-250" y1="0" x2="-50" y2="100" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="-250" y1="20" x2="-50" y2="120" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="-250" y1="40" x2="-50" y2="140" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="-250" y1="60" x2="-50" y2="160" stroke="#D4AF37" stroke-width="0.5"/>
      
      <!-- Energy bands inside the right forcefield -->
      <line x1="250" y1="0" x2="50" y2="100" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="250" y1="20" x2="50" y2="120" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="250" y1="40" x2="50" y2="140" stroke="#D4AF37" stroke-width="0.5"/>
      <line x1="250" y1="60" x2="50" y2="160" stroke="#D4AF37" stroke-width="0.5"/>
    </g>

    <!-- Scanning Drone / Logistics Copter above -->
    <g filter="url(#box-glow)">
      <!-- Path animation -->
      <animateMotion path="M -150,-150 L 0,-250 L 150,-150 L 0,-50 Z" dur="15s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="10" fill="#161616" stroke="#D4AF37" stroke-width="2"/>
      <path d="M -20,0 L 20,0 M 0,-20 L 0,20" stroke="#D4AF37" stroke-width="1"/>
      <!-- Downward scanning beam -->
      <polygon points="-10,5 10,5 80,100 -80,100" fill="url(#beam)"/>
    </g>
    
    <!-- Glowing Data Cubes inside Left Storage Array -->
    <g transform="translate(-120, 20)">
      <polygon points="0,-15 30,0 0,15 -30,0" fill="#D4AF37" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-30,0 0,15 0,35 -30,20" fill="#D4AF37" opacity="0.5"/>
      <polygon points="0,15 30,0 30,20 0,35" fill="#D4AF37" opacity="0.3"/>
    </g>
    <g transform="translate(-80, 50)">
      <polygon points="0,-10 20,0 0,10 -20,0" fill="#D4AF37" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-20,0 0,10 0,25 -20,15" fill="#D4AF37" opacity="0.4"/>
      <polygon points="0,10 20,0 20,15 0,25" fill="#D4AF37" opacity="0.2"/>
    </g>

    <!-- Glowing Data Cubes inside Right Storage Array -->
    <g transform="translate(100, 20)">
      <polygon points="0,-15 30,0 0,15 -30,0" fill="#D4AF37" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-30,0 0,15 0,35 -30,20" fill="#D4AF37" opacity="0.3"/>
      <polygon points="0,15 30,0 30,20 0,35" fill="#D4AF37" opacity="0.2"/>
    </g>
  </g>

  <!-- Side UI text overlays -->
  <g font-family="monospace" font-size="10" fill="#D4AF37" opacity="0.6">
    <g transform="translate(50, 650)">
      <text x="0" y="0">WAREHOUSE_CTRL v2</text>
      <text x="0" y="20">CAPACITY: 85% STABLE</text>
      <text x="0" y="40">DRONE_SWARM: DEPLOYED</text>
      <!-- Mini storage capacity bar graph -->
      <rect x="0" y="50" width="10" height="40" fill="#D4AF37" opacity="0.3"/>
      <rect x="0" y="60" width="10" height="30" fill="#D4AF37"/>
      
      <rect x="15" y="50" width="10" height="40" fill="#D4AF37" opacity="0.3"/>
      <rect x="15" y="65" width="10" height="25" fill="#D4AF37"/>
      
      <rect x="30" y="50" width="10" height="40" fill="#D4AF37" opacity="0.3"/>
      <rect x="30" y="55" width="10" height="35" fill="#D4AF37"/>
      
      <rect x="45" y="50" width="10" height="40" fill="#D4AF37" opacity="0.3"/>
      <rect x="45" y="80" width="10" height="10" fill="#D4AF37"/>
    </g>
  </g>
</svg>
