<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F3E5AB" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <g opacity="0.05" stroke="#D4AF37" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- Abstract curved roads/paths -->
  <path d="M-100,500 C200,500 300,100 900,200" fill="none" stroke="url(#gold-grad)" stroke-width="4" opacity="0.5"/>
  <path d="M-100,550 C250,550 350,150 900,250" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.3"/>
  <path d="M-100,600 C300,600 400,200 900,300" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.1"/>
  
  <!-- Glowing nodes -->
  <circle cx="250" cy="300" r="6" fill="#D4AF37" opacity="0.8">
    <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="180" r="4" fill="#D4AF37" opacity="0.6"/>
  <circle cx="350" cy="380" r="5" fill="#D4AF37" opacity="0.4"/>
  
  <!-- Abstract car silhouette / transport module -->
  <path d="M350,300 L380,280 L450,280 L480,300 L500,320 L330,320 Z" fill="#161616" stroke="url(#gold-grad)" stroke-width="2" opacity="0.9"/>
  <circle cx="380" cy="320" r="8" fill="#161616" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="450" cy="320" r="8" fill="#161616" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Speed lines -->
  <line x1="300" y1="290" x2="150" y2="290" stroke="#D4AF37" stroke-width="2" opacity="0.3" stroke-dasharray="10 5"/>
  <line x1="320" y1="310" x2="100" y2="310" stroke="#D4AF37" stroke-width="2" opacity="0.2" stroke-dasharray="20 10"/>
  <line x1="520" y1="300" x2="600" y2="300" stroke="#D4AF37" stroke-width="1" opacity="0.2" stroke-dasharray="5 5"/>
</svg>